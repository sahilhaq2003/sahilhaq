# Optional: run a local MongoDB with Docker
#   docker compose up -d
# Then use MONGODB_URI=mongodb://127.0.0.1:27017/sahil_portfolio in backend/.env
services:
  mongo:
    image: mongo:7
    container_name: sahil-portfolio-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
